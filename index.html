<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dərs Dəftərim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5EE;
    --grid:#C7D9EC;
    --margin:#D6534C;
    --ink:#1E2A44;
    --ink-soft:#5B6478;
    --card:#FFFFFF;
    --shadow: 0 2px 10px rgba(30,42,68,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  .margin-line{
    position:fixed;
    top:0; bottom:0;
    left:34px;
    width:2px;
    background:var(--margin);
    opacity:0.55;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    padding: 22px 16px 16px 46px;
  }
  header{ margin-bottom:18px; }
  h1{
    font-family:'Caveat',cursive;
    font-size:2.5rem;
    font-weight:700;
    margin:0 0 2px 0;
    color:var(--ink);
    line-height:1;
  }
  .date-today{ font-size:0.85rem; color:var(--ink-soft); font-weight:600; }

  .card{
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin:0 0 12px 0;
    font-weight:800;
  }

  select, input[type="date"], input[type="text"], input[type="number"], input[type="month"], textarea{
    width:100%;
    font-family:'Nunito',sans-serif;
    font-size:1rem;
    padding:10px 12px;
    border-radius:9px;
    border:1.5px solid #E4E1D6;
    background:#FCFBF7;
    color:var(--ink);
    font-weight:600;
    margin-bottom:10px;
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid #4C6EF5; outline-offset:1px; }
  label.small{
    font-size:0.75rem;
    color:var(--ink-soft);
    font-weight:700;
    display:block;
    margin-bottom:4px;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  button{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    border:none;
    border-radius:9px;
    padding:11px 16px;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn-primary{ background:var(--ink); color:#fff; width:100%; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-secondary{
    background:#EFEBDD;
    color:var(--ink);
    width:100%;
  }
  .btn-secondary:active{ transform:scale(0.98); }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
    background:#EFEBDD;
    padding:4px;
    border-radius:11px;
  }
  .tab{
    flex:1 1 30%;
    text-align:center;
    padding:9px 4px;
    border-radius:8px;
    font-weight:800;
    font-size:0.8rem;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .tab.active{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); }

  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px dashed #E4E1D6;
  }
  .entry:last-child{ border-bottom:none; }
  .tag{ width:6px; align-self:stretch; border-radius:4px; flex-shrink:0; }
  .entry-main{ flex:1; min-width:0; }
  .entry-subject{ font-weight:800; font-size:0.95rem; }
  .entry-teacher{ font-size:0.8rem; color:var(--ink-soft); }
  .entry-date{ font-size:0.78rem; color:var(--ink-soft); font-weight:700; white-space:nowrap; }
  .del-btn{ background:none; border:none; color:#C7C2B2; font-size:1.1rem; cursor:pointer; padding:2px 6px; }

  .stat-row{ margin-bottom:12px; }
  .stat-top{ display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px; }
  .stat-name{ font-weight:800; }
  .stat-count{ color:var(--ink-soft); font-weight:700; }
  .bar-bg{ background:#EFEBDD; border-radius:6px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }

  .total-line{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top:10px; margin-top:6px; border-top:1.5px solid var(--ink); font-weight:800;
  }
  .total-line .num{ font-family:'Caveat',cursive; font-size:1.6rem; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:0.85rem; padding:18px 0; font-style:italic; }

  .subject-edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .subject-edit-row .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .subject-edit-row input{ margin-bottom:0; flex:1; }
  .subject-edit-row .del-btn{ flex-shrink:0; }

  .loading{ text-align:center; padding:30px; color:var(--ink-soft); }
  .note{ font-size:0.78rem; color:var(--ink-soft); font-weight:600; line-height:1.5; }
  .warn{
    background:#FFF4E5; border:1.5px solid #F0B84C; color:#8A5A00;
    font-size:0.78rem; font-weight:700; padding:10px 12px; border-radius:9px; margin-bottom:14px;
  }
  .ok{
    background:#EAF7EC; border:1.5px solid #6FCF7E; color:#217A34;
    font-size:0.78rem; font-weight:700; padding:10px 12px; border-radius:9px; margin-bottom:14px;
  }
</style>
</head>
<body>
<div class="margin-line"></div>
<div class="wrap">
  <header>
    <h1>Dərs Dəftərim</h1>
    <div class="date-today" id="todayLabel"></div>
  </header>
  <div id="app"><div class="loading">Yüklənir...</div></div>
</div>

<script>
const DEFAULT_SUBJECTS = [
  {id:'riyaziyyat', name:'Riyaziyyat', color:'#4C6EF5'},
  {id:'ingilis', name:'İngilis dili', color:'#E8890C'},
  {id:'fizika', name:'Fizika', color:'#7048E8'},
  {id:'rus', name:'Rus dili', color:'#E64980'},
  {id:'azerb', name:'Azərbaycan dili', color:'#2F9E44'},
  {id:'kimya', name:'Kimya', color:'#0C8F7A'},
];
const COLOR_POOL = ['#4C6EF5','#E8890C','#7048E8','#E64980','#2F9E44','#0C8F7A','#C2410C','#0EA5E9','#A855F7','#DB2777','#65A30D','#0891B2'];

let data = { subjects: {}, order: [], visits: [], payments: [] };
let activeTab = 'today';
let ready = false;
let statusMsg = null; // {type:'ok'|'warn', text}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  const months=['yan','fev','mar','apr','may','iyn','iyl','avq','sen','okt','noy','dek'];
  return d.getDate()+' '+months[d.getMonth()];
}
function monthLabel(ym){
  const months=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
  const [y,m]=ym.split('-');
  return months[parseInt(m,10)-1]+' '+y;
}
function currentMonth(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function slug(str){
  return 'f_'+str.toLowerCase()
    .replace(/ə/g,'e').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ü/g,'u')
    .replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g')
    .replace(/[^a-z0-9]+/g,'')+'_'+uid();
}

const STORAGE_KEY = 'ders-defteri-data-v1';

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = JSON.parse(raw);
    }
  }catch(e){
    // storage unavailable (e.g. private/incognito mode) — continue with fresh/default data
  }
  if(!data.subjects) data.subjects = {};
  if(!data.order) data.order = [];
  if(data.order.length===0){
    DEFAULT_SUBJECTS.forEach(s=>{
      data.subjects[s.id] = { name:s.name, teacher:'', color:s.color };
      data.order.push(s.id);
    });
  }
  if(!data.visits) data.visits = [];
  if(!data.payments) data.payments = [];
  ready = true;
  render();
}

async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    // Silent — e.g. private/incognito mode blocks storage. Data still works this session.
  }
}

function subjectColor(id){
  return (data.subjects[id] && data.subjects[id].color) || '#888';
}
function nextColor(){
  const used = data.order.map(id=>data.subjects[id].color);
  const free = COLOR_POOL.find(c=>!used.includes(c));
  return free || COLOR_POOL[data.order.length % COLOR_POOL.length];
}

function addVisit(subjectId, date){
  data.visits.push({ id: uid(), subjectId, date });
  data.visits.sort((a,b)=> b.date.localeCompare(a.date));
  persist(); render();
}
function removeVisit(id){
  data.visits = data.visits.filter(v=>v.id!==id);
  persist(); render();
}
function addPayment(month, amount){
  const existing = data.payments.find(p=>p.month===month);
  if(existing){ existing.amount = amount; }
  else{ data.payments.push({ id: uid(), month, amount }); }
  data.payments.sort((a,b)=> b.month.localeCompare(a.month));
  persist(); render();
}
function removePayment(id){
  data.payments = data.payments.filter(p=>p.id!==id);
  persist(); render();
}
function updateTeacher(subjectId, name){
  data.subjects[subjectId].teacher = name;
  persist();
}
function addSubject(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return false;
  const already = data.order.some(id=> data.subjects[id].name.toLowerCase() === trimmed.toLowerCase());
  if(already) return 'dup';
  const id = slug(trimmed);
  data.subjects[id] = { name: trimmed, teacher: '', color: nextColor() };
  data.order.push(id);
  persist(); render();
  return true;
}
function removeSubject(id){
  const hasVisits = data.visits.some(v=>v.subjectId===id);
  if(hasVisits && !confirm('Bu fənnə aid qeydlər var. Fənni və onun bütün qeydlərini silmək istəyirsən?')) return;
  data.order = data.order.filter(x=>x!==id);
  delete data.subjects[id];
  data.visits = data.visits.filter(v=>v.subjectId!==id);
  persist(); render();
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('todayLabel').textContent = 'Bugün: ' + fmtDate(todayISO());
  if(!ready){ app.innerHTML = '<div class="loading">Yüklənir...</div>'; return; }

  let html = '';

  html += `
  <div class="card">
    <h2>Bugünkü dərsi qeyd et</h2>
    <label class="small">Fənn</label>
    <select id="addSubject">
      ${data.order.map(id=>`<option value="${id}">${escapeHtml(data.subjects[id].name)}${data.subjects[id].teacher ? ' — '+escapeHtml(data.subjects[id].teacher) : ''}</option>`).join('')}
    </select>
    <label class="small">Tarix</label>
    <input type="date" id="addDate" value="${todayISO()}">
    <button class="btn-primary" id="addVisitBtn">+ Əlavə et</button>
  </div>`;

  const tabs = [
    {id:'today', label:'Tarixçə'},
    {id:'stats', label:'Statistika'},
    {id:'money', label:'Xərclər'},
    {id:'settings', label:'Fənnlər'},
  ];
  html += `<div class="tabs">${tabs.map(t=>`<div class="tab ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('')}</div>`;

  if(activeTab==='today') html += renderHistory();
  else if(activeTab==='stats') html += renderStats();
  else if(activeTab==='money') html += renderMoney();
  else if(activeTab==='settings') html += renderSettings();

  app.innerHTML = html;
  attachHandlers();
}

function renderHistory(){
  let html = '<div class="card"><h2>Bütün qeydlər</h2>';
  if(data.visits.length===0){
    html += '<div class="empty">Hələ heç bir dərs qeyd olunmayıb.<br>Yuxarıdan əlavə et.</div>';
  } else {
    data.visits.forEach(v=>{
      const subj = data.subjects[v.subjectId];
      if(!subj) return;
      html += `
      <div class="entry">
        <div class="tag" style="background:${subjectColor(v.subjectId)}"></div>
        <div class="entry-main">
          <div class="entry-subject">${escapeHtml(subj.name)}</div>
          ${subj.teacher ? `<div class="entry-teacher">${escapeHtml(subj.teacher)}</div>` : ''}
        </div>
        <div class="entry-date">${fmtDate(v.date)}</div>
        <button class="del-btn" data-del-visit="${v.id}" title="Sil">✕</button>
      </div>`;
    });
  }
  html += '</div>';
  return html;
}

function renderStats(){
  const counts = {};
  data.order.forEach(id=> counts[id]=0);
  data.visits.forEach(v=>{ if(counts[v.subjectId]!==undefined) counts[v.subjectId]++; });
  const max = Math.max(1, ...Object.values(counts));
  const total = data.visits.length;

  let html = '<div class="card"><h2>Fənn üzrə toplam</h2>';
  if(data.order.length===0){
    html += '<div class="empty">Hələ fənn yoxdur.</div>';
  } else {
    data.order.forEach(id=>{
      const s = data.subjects[id];
      const c = counts[id]||0;
      const pct = Math.round((c/max)*100);
      html += `
      <div class="stat-row">
        <div class="stat-top">
          <span class="stat-name">${escapeHtml(s.name)}</span>
          <span class="stat-count">${c} dəfə</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${c===0?0:Math.max(pct,6)}%; background:${s.color}"></div></div>
      </div>`;
    });
  }
  html += `<div class="total-line"><span>Ümumi</span><span class="num">${total}</span></div>`;
  html += '</div>';
  return html;
}

function renderMoney(){
  const cm = currentMonth();
  const thisMonthAmt = data.payments.find(p=>p.month===cm);
  let html = `
  <div class="card">
    <h2>Aylıq ödəniş əlavə et</h2>
    <div class="row2">
      <div>
        <label class="small">Ay</label>
        <input type="month" id="payMonth" value="${cm}">
      </div>
      <div>
        <label class="small">Məbləğ (AZN)</label>
        <input type="number" id="payAmount" placeholder="40" value="${thisMonthAmt ? thisMonthAmt.amount : ''}" min="0" step="0.5">
      </div>
    </div>
    <button class="btn-primary" id="addPaymentBtn">Yadda saxla</button>
  </div>`;

  html += '<div class="card"><h2>Ödəniş tarixçəsi</h2>';
  if(data.payments.length===0){
    html += '<div class="empty">Hələ ödəniş qeyd olunmayıb.</div>';
  } else {
    let sum = 0;
    data.payments.forEach(p=>{
      sum += Number(p.amount)||0;
      html += `
      <div class="entry">
        <div class="entry-main"><div class="entry-subject">${monthLabel(p.month)}</div></div>
        <div class="entry-date">${Number(p.amount).toFixed(2)} ₼</div>
        <button class="del-btn" data-del-payment="${p.id}" title="Sil">✕</button>
      </div>`;
    });
    html += `<div class="total-line"><span>Cəmi</span><span class="num">${sum.toFixed(2)} ₼</span></div>`;
  }
  html += '</div>';
  return html;
}

function renderSettings(){
  let html = '<div class="card"><h2>Fənn əlavə et</h2>';
  html += `
    <div class="row2">
      <div style="flex:2;">
        <input type="text" id="newSubjectName" placeholder="Məs: Coğrafiya">
      </div>
    </div>
    <button class="btn-primary" id="addSubjectBtn">+ Fənn əlavə et</button>
    <div id="addSubjectMsg" style="font-size:0.78rem;font-weight:700;margin-top:6px;"></div>
  </div>`;

  html += '<div class="card"><h2>Fənnlər və müəllim adları</h2>';
  if(data.order.length===0){
    html += '<div class="empty">Hələ fənn yoxdur, yuxarıdan əlavə et.</div>';
  } else {
    data.order.forEach(id=>{
      const s = data.subjects[id];
      html += `
      <div class="subject-edit-row">
        <div class="dot" style="background:${s.color}"></div>
        <input type="text" data-teacher-for="${id}" placeholder="${escapeHtml(s.name)} müəllimi" value="${escapeHtml(s.teacher||'')}">
        <button class="del-btn" data-del-subject="${id}" title="Fənni sil">✕</button>
      </div>`;
    });
    html += '<div class="note">Adları yazdıqca avtomatik yadda saxlanılır.</div>';
  }
  html += '</div>';
  return html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str||'';
  return div.innerHTML;
}

function attachHandlers(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ activeTab = t.dataset.tab; statusMsg=null; render(); };
  });

  const addBtn = document.getElementById('addVisitBtn');
  if(addBtn){
    addBtn.onclick = ()=>{
      const subj = document.getElementById('addSubject').value;
      const date = document.getElementById('addDate').value || todayISO();
      if(!subj) return;
      addVisit(subj, date);
    };
  }
  document.querySelectorAll('[data-del-visit]').forEach(b=>{
    b.onclick = ()=> removeVisit(b.dataset.delVisit);
  });

  const payBtn = document.getElementById('addPaymentBtn');
  if(payBtn){
    payBtn.onclick = ()=>{
      const month = document.getElementById('payMonth').value || currentMonth();
      const amount = parseFloat(document.getElementById('payAmount').value);
      if(isNaN(amount)) return;
      addPayment(month, amount);
    };
  }
  document.querySelectorAll('[data-del-payment]').forEach(b=>{
    b.onclick = ()=> removePayment(b.dataset.delPayment);
  });

  document.querySelectorAll('[data-teacher-for]').forEach(inp=>{
    inp.oninput = ()=> updateTeacher(inp.dataset.teacherFor, inp.value);
  });

  const addSubjBtn = document.getElementById('addSubjectBtn');
  if(addSubjBtn){
    addSubjBtn.onclick = ()=>{
      const inp = document.getElementById('newSubjectName');
      const result = addSubject(inp.value);
      const msg = document.getElementById('addSubjectMsg');
      if(result===true){
        // render() already called inside addSubject; message will be gone after re-render,
        // so re-fetch after render and show inline instead:
      } else if(result==='dup'){
        if(msg){ msg.style.color='#D6534C'; msg.textContent='Bu fənn artıq var.'; }
      } else {
        if(msg){ msg.style.color='#D6534C'; msg.textContent='Fənn adını yaz.'; }
      }
    };
  }
  document.querySelectorAll('[data-del-subject]').forEach(b=>{
    b.onclick = ()=> removeSubject(b.dataset.delSubject);
  });
}

load();
</script>
</body>
</html>
